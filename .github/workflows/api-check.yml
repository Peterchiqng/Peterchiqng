name: api-check
on:
  push:
    branches: [api-check]
permissions:
  contents: write
jobs:
  p:
    if: "!contains(github.event.head_commit.message, 'check output')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/api_check.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
          git add api_check.json; git commit -m "check output"; git push
