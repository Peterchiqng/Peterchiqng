name: probe
on: push
permissions:
  contents: write
jobs:
  p:
    if: "!contains(github.event.head_commit.message, 'probe output')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py > probe_out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
          git add probe_out.txt; git commit -m "probe output"; git push
