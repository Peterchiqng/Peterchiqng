name: probe
on: push
permissions:
  contents: write
jobs:
  p:
    if: "!contains(github.event.head_commit.message, 'probe output')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install xlrd==2.0.1
      - run: python scripts/market_crawl.py 2>&1 | tee crawl_log.txt || true
        env:
          CRAWL_BUDGET_MIN: "25"
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
          git add -A market crawl_log.txt; git commit -m "probe output"; git push
